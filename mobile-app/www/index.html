<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <meta http-equiv="refresh" content="0;url=https://www.kovcareeragency.org/">
  <title>KOV Career Agency</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: #fff; color: #172033; font-family: Arial, sans-serif; }
    main { min-height: 100vh; display: grid; place-items: center; padding: 24px; text-align: center; }
    p { max-width: 30rem; line-height: 1.6; color: #596579; }
    a { color: #173f73; font-weight: 600; }
  </style>
</head>
<body>
  <main>
    <section>
      <h1>KOV Career Agency</h1>
      <p id="status">Opening the official KOV Career Agency website…</p>
      <p><a href="https://www.kovcareeragency.org/">Continue to KOV Career Agency</a></p>
    </section>
  </main>
  <script>
    // Keep the live KOV website as the only content source. The app ships this
    // tiny local bootstrap rather than using Capacitor's live-reload server.url.
    window.location.replace("https://www.kovcareeragency.org/");
  </script>
</body>
</html>
