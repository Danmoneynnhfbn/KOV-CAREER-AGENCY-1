    <g fill="#090e13" font-size="15" font-weight="600">
      <text x="91" y="265">Target Companies</text><text x="91" y="392">Executive Profiles</text>
      <text x="903" y="265">Career Histories</text><text x="903" y="392">Industry Signals</text>
      <text x="497" y="265">Professional Networks</text><text x="497" y="392">Market Intelligence</text>
