<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" role="img" aria-labelledby="title desc">
  <title id="title">Illustrative KOV research layer</title>
  <desc id="desc">A conceptual, non-client-specific arrangement of target companies, executive profiles, career histories, industry signals, professional networks, and market intelligence. No sample people or performance figures are shown.</desc>
  <rect width="1200" height="660" fill="#f8f5ef"/>
  <g stroke="#cdd1d6" stroke-width="1" fill="none">
