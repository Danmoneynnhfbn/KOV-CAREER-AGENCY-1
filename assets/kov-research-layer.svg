  <text x="600" y="590" fill="#555b62" font-family="Inter, Arial, sans-serif" font-size="12" text-anchor="middle" letter-spacing="1.4">CONCEPTUAL VISUAL · NO CLIENT DATA OR PERFORMANCE METRICS</text>
