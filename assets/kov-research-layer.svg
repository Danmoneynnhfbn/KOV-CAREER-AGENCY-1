  <text x="48" y="151" fill="#090e13" font-family="Fraunces, Georgia, serif" font-size="35">KOV Research Layer</text>
  <text x="48" y="183" fill="#555b62" font-family="Inter, Arial, sans-serif" font-size="14">A structured view of the market before outreach begins</text>
  <g font-family="Inter, Arial, sans-serif">
