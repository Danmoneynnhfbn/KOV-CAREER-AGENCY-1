  <text x="108" y="134" fill="#aa4c27" font-family="Arial,sans-serif" font-size="17" letter-spacing="3">ROLE REVIEW / SAMPLE</text>
  <text x="108" y="238" fill="#111920" font-family="Georgia,serif" font-size="39" font-style="italic">Opportunity brief</text>
  <g font-family="Arial,sans-serif" fill="#111920"><text x="108" y="298" font-size="16" letter-spacing="2">TARGET FIT</text><text x="108" y="400" font-size="16" letter-spacing="2">POSITIONING</text><text x="108" y="502" font-size="16" letter-spacing="2">APPROVAL</text></g>
  <g stroke="#cdd1d6" stroke-width="2"><path d="M108 324H600M108 348H540M108 426H600M108 450H510M108 528H600M108 552H520"/></g>
