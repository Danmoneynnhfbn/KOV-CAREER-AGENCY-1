<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 900" role="img" aria-labelledby="title desc">
  <title id="title">Personalized executive outreach route</title>
  <desc id="desc">A five-step sequence from organization research to considerate follow-up.</desc>
  <rect width="720" height="900" fill="#111920"/>
  <path d="M142 188V718" stroke="#e4b184" stroke-width="2" stroke-dasharray="7 10"/>
  <text x="62" y="86" fill="#e4b184" font-family="Arial,sans-serif" font-size="16" letter-spacing="4">OUTREACH / SEQUENCE</text>
  <g font-family="Arial,sans-serif">
    <g><circle cx="142" cy="208" r="31" fill="#111920" stroke="#dd7040" stroke-width="3"/><text x="131" y="215" fill="#fff" font-size="18">01</text><text x="206" y="202" fill="#f7f2e9" font-size="23">Research the context</text><text x="206" y="232" fill="#c7c9c7" font-size="16">Role, organization, relevant signals</text></g>
    <g><circle cx="142" cy="328" r="31" fill="#111920" stroke="#e4b184" stroke-width="2"/><text x="131" y="335" fill="#fff" font-size="18">02</text><text x="206" y="322" fill="#f7f2e9" font-size="23">Identify the right contact</text><text x="206" y="352" fill="#c7c9c7" font-size="16">Recruiter or hiring stakeholder</text></g>
    <g><circle cx="142" cy="448" r="31" fill="#111920" stroke="#e4b184" stroke-width="2"/><text x="131" y="455" fill="#fff" font-size="18">03</text><text x="206" y="442" fill="#f7f2e9" font-size="23">Personalize the message</text><text x="206" y="472" fill="#c7c9c7" font-size="16">Relevant, specific, and considered</text></g>
    <g><circle cx="142" cy="568" r="31" fill="#111920" stroke="#e4b184" stroke-width="2"/><text x="131" y="575" fill="#fff" font-size="18">04</text><text x="206" y="562" fill="#f7f2e9" font-size="23">Agree and send</text><text x="206" y="592" fill="#c7c9c7" font-size="16">Within the agreed scope and approvals</text></g>
    <g><circle cx="142" cy="688" r="31" fill="#111920" stroke="#dd7040" stroke-width="3"/><text x="131" y="695" fill="#fff" font-size="18">05</text><text x="206" y="682" fill="#f7f2e9" font-size="23">Track the next step</text><text x="206" y="712" fill="#c7c9c7" font-size="16">Record response and follow-up timing</text></g>
  </g>
  <text x="62" y="830" fill="#c7c9c7" font-family="Georgia,serif" font-size="28" font-style="italic">Human outreach, grounded in research.</text>
</svg>
