<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">KOV career journey</title>
  <desc id="desc">An abstract illustration of a professional journey connecting experience, research, and opportunity.</desc>
  <defs>
