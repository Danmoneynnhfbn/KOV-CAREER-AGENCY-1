  <path d="M122 382C224 380 241 243 363 278S520 389 618 276 755 145 842 168" fill="none" stroke="url(#path)" stroke-width="5" stroke-linecap="round" stroke-dasharray="1 1"/>
  <g filter="url(#shadow)">
