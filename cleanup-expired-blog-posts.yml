name: Clean expired blog posts

on:
  schedule:
    - cron: '0 0 * * *' # daily at 00:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete expired blog posts
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const postsPath = 'posts';
            const branch = 'main';
            const now = new Date();
            const repo = context.repo;

            async function getContents(path) {
              try {
                const result = await github.rest.repos.getContent({
                  owner: repo.owner,
                  repo: repo.repo,
                  path,
                  ref: branch,
                });
                return result.data;
              } catch (error) {
                if (error.status === 404) {
                  return null;
                }
                throw error;
              }
            }

            const contents = await getContents(postsPath);
            if (!Array.isArray(contents)) {
              core.info(`The ${postsPath} folder does not exist yet; nothing to clean.`);
              return;
            }

            const expiredFiles = [];
            for (const item of contents) {
              if (item.type !== 'file' || !item.name.toLowerCase().endsWith('.json')) {
                continue;
              }

              const file = await github.rest.repos.getContent({
                owner: repo.owner,
                repo: repo.repo,
                path: item.path,
                ref: branch,
              });

              const text = Buffer.from(file.data.content, 'base64').toString('utf8');
              let post;
              try {
                post = JSON.parse(text);
              } catch (error) {
                core.warning(`Unable to parse ${item.path}; skipping.`);
                continue;
              }

              const expiresAt = post.expiresAt || post.publishedAt;
              if (!expiresAt) {
                continue;
              }

              if (new Date(expiresAt) < now) {
                expiredFiles.push({ path: item.path, sha: file.data.sha, title: post.title || item.name });
              }
            }

            if (!expiredFiles.length) {
              core.info('No expired posts found.');
              return;
            }

            for (const expired of expiredFiles) {
              await github.rest.repos.deleteFile({
                owner: repo.owner,
                repo: repo.repo,
                path: expired.path,
                message: `Delete expired post: ${expired.title}`,
                sha: expired.sha,
                branch,
              });
              core.info(`Deleted expired post: ${expired.path}`);
            }
