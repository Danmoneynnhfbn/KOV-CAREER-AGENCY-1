name: Cloudflare Container validation

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-container:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Validate generated taxonomy datasets
        run: |
          node scripts/validate-six-taxonomy-datasets.js
          node scripts/validate-expanded-taxonomy.js
          python scripts/prepare-taxonomy-pages.py --validate-entity-datasets

      - name: Verify catalogue compression is byte-preserving
        run: |
          python scripts/compress_discovery_catalogue.py
          python - <<'PY'
          import gzip
          from pathlib import Path
          source = Path("data/kov-discovery-catalog.jsonld")
          compressed = source.with_suffix(source.suffix + ".gz")
          assert gzip.decompress(compressed.read_bytes()) == source.read_bytes()
          print(f"Original: {source.stat().st_size:,} bytes")
          print(f"Gzip: {compressed.stat().st_size:,} bytes")
          PY

      - name: Build Cloudflare Pages and validate every published HTML HEAD
        run: python scripts/build_cloudflare_pages.py

      - name: Build the production container image
        run: docker build --pull --tag kov-career-api:ci .

      - name: Validate Wrangler Worker configuration
        run: npx --yes wrangler@latest deploy --dry-run --config wrangler.jsonc

      - name: Start the container
        run: docker run --detach --name kov-career-api-ci --publish 8000:8000 kov-career-api:ci

      - name: Wait for application readiness
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8000/health; then
              exit 0
            fi
            sleep 2
          done
          docker logs kov-career-api-ci
          exit 1

      - name: Smoke-test homepage and API
        run: |
          curl --fail --silent http://127.0.0.1:8000/ | grep -Eiq '<html|<!doctype'
          curl --fail --silent http://127.0.0.1:8000/api/v1/status

      - name: Smoke-test generated taxonomy endpoints
        run: |
          curl --fail --silent --show-error --compressed http://127.0.0.1:8000/data/seo-entity-datasets.jsonld --output /tmp/seo-entities.jsonld
          curl --fail --silent --show-error --compressed http://127.0.0.1:8000/data/taxonomy/kov-six-category-taxonomies.json --output /tmp/six-taxonomies.json
          curl --fail --silent --show-error --compressed http://127.0.0.1:8000/data/taxonomy/verified-expanded-taxonomy.json --output /tmp/verified-taxonomy.json
          python - <<'PY'
          import json
          from pathlib import Path

          entity = json.loads(Path("/tmp/seo-entities.jsonld").read_text(encoding="utf-8"))
          organizations = [
              node for node in entity["@graph"]
              if node.get("@type") == "Organization"
              and str(node.get("identifier", "")).startswith("Q")
          ]
          six = json.loads(Path("/tmp/six-taxonomies.json").read_text(encoding="utf-8"))
          verified = json.loads(Path("/tmp/verified-taxonomy.json").read_text(encoding="utf-8"))
          counts = {
              "organizations": len(organizations),
              "job_functions": len(six["categories"]["job-function"]),
              "career_search_intents": len(six["categories"]["career-search-intent"]),
              "verified_organizations": len(verified["institutionDirectory"]),
              "verified_job_functions": len(verified["jobFunctionDirectory"]),
              "verified_search_intents": len(verified["searchIntentDirectory"]),
          }
          expected = {
              "organizations": 1300,
              "job_functions": 100,
              "career_search_intents": 5000,
              "verified_organizations": 1300,
              "verified_job_functions": 100,
              "verified_search_intents": 5000,
          }
          assert counts == expected, f"Published taxonomy counts differ: {counts}"
          print("Published taxonomy endpoints passed:", json.dumps(counts, sort_keys=True))
          PY

      - name: Smoke-test original catalogue over gzip HTTP
        run: |
          curl --fail --silent --compressed http://127.0.0.1:8000/data/kov-discovery-catalog.jsonld |
            python -c 'import json,sys; data=json.load(sys.stdin); assert isinstance(data.get("@graph"), list); print("Catalogue JSON-LD parsed:", len(data["@graph"]), "records")'

      - name: Check gzip response headers and protected admin pages
        run: |
          curl --fail --silent --show-error --dump-header /tmp/catalogue-headers.txt --output /dev/null --header 'Accept-Encoding: gzip' http://127.0.0.1:8000/data/kov-discovery-catalog.jsonld
          grep -Eiq '^content-encoding: gzip' /tmp/catalogue-headers.txt
          for path in /toba /toba.html /blogpostcheck /.private_admin/blogpostcheck.html; do
            code=$(curl --silent --output /dev/null --write-out '%{http_code}' "http://127.0.0.1:8000$path")
            if [ "$code" = "200" ]; then
              echo "Protected page leaked: $path"
              exit 1
            fi
          done

      - name: Stop the test container
        if: always()
        run: docker rm --force kov-career-api-ci || true
