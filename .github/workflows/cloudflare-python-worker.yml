name: Cloudflare Python Worker validation

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install Python Worker dependencies
        run: uv sync

      - name: Prepare Cloudflare public assets
        run: uv run python scripts/prepare_cloudflare_assets.py

      - name: Check Python syntax
        run: uv run python -m compileall -q backend_api.py cloudflare_worker.py cloudflare_private_pages.py

      - name: Validate Worker bundle without deploying
        run: uv run pywrangler deploy --dry-run
