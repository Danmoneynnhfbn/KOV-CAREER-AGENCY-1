name: KOV Mobile App Build

on:
  workflow_dispatch:
  push:
    paths:
      - "mobile-app/**"
      - ".github/workflows/mobile-app-build.yml"

permissions:
  contents: read

jobs:
  android-release:
    name: Android debug APK and release AAB
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install dependencies
        run: npm install
      - name: Generate Android project
        run: npx cap add android
      - name: Sync website wrapper
        run: npx cap sync android
      - name: Verify Android 16 target
        run: |
          grep -E 'targetSdkVersion' android/variables.gradle
          grep -Eq 'targetSdkVersion[[:space:]]*=[[:space:]]*36' android/variables.gradle
      - name: Build debug APK and release App Bundle
        run: cd android && ./gradlew assembleDebug bundleRelease
      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kov-career-agency-android-builds
          path: |
            mobile-app/android/app/build/outputs/apk/debug/app-debug.apk
            mobile-app/android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

  ios-simulator:
    name: iOS simulator build
    runs-on: macos-latest
    defaults:
      run:
        working-directory: mobile-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Generate iOS project
        run: npx cap add ios
      - name: Sync website wrapper
        run: npx cap sync ios
      - name: Build iOS simulator app
        run: |
          cd ios/App
          xcodebuild -project App.xcodeproj -scheme App -sdk iphonesimulator -configuration Debug -derivedDataPath build CODE_SIGNING_ALLOWED=NO
      - uses: actions/upload-artifact@v4
        with:
          name: kov-career-agency-ios-simulator
          path: mobile-app/ios/App/build/Build/Products/Debug-iphonesimulator/App.app
          if-no-files-found: error
