name: Complete directory path migration

on:
  push:
    branches:
      - master
    paths:
      - scripts/migrate-directory-paths.js
      - .github/workflows/migrate-directory-paths.yml

permissions:
  contents: write

jobs:
  migrate:
    if: contains(github.event.head_commit.message, '[directory-path-migration]')
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Replace legacy staging folder references
        run: node scripts/migrate-directory-paths.js

      - name: Commit complete migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No remaining legacy path changes."
            exit 0
          fi
          git commit -m "Complete staging to directory path migration [skip ci]"
          git push origin HEAD:master
