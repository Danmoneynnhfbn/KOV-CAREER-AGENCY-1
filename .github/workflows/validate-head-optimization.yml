name: Validate JSON-LD generation and lossless HEAD preservation

on:
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-head-output:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install locked Node dependencies
        run: npm ci
      - name: Build Cloudflare output with JSON-LD before HEAD optimization
        run: python scripts/build_cloudflare_pages.py
      - name: Validate page coverage, JSON-LD, and preservation
        run: |
          python - <<'PY'
          import gzip
          import json
          import re
          from pathlib import Path

          repo = Path(".")
          output = repo / "dist"
          manifest = json.loads((repo / "PAGE_MANIFEST.json").read_text(encoding="utf-8"))
          inventory = manifest.get("repository_html_inventory", {}).get("files", [])
          inventory_paths = {item["path"].replace("\\", "/") for item in inventory}
          pages = sorted(output.rglob("*.html"))
          published_paths = {page.relative_to(output).as_posix() for page in pages}
          staging_public_paths = {
              line.strip().replace("\\", "/")
              for line in (repo / "scripts" / "staging-public-pages.txt").read_text(encoding="utf-8").splitlines()
              if line.strip()
          }
          active_paths = set()
          for relative in published_paths:
              excluded = (
                  (relative.startswith("directory/") and relative not in staging_public_paths)
                  or relative.startswith("_design-reference/")
                  or relative.startswith("design-reference/")
                  or re.match(r"^(?:private|admin)(?:/|[-_])", relative, re.I)
              )
              if excluded:
                  continue
              page_html = (output / relative).read_text(encoding="utf-8")
              page_head = re.search(r"<head\b[^>]*>([\s\S]*?)</head\s*>", page_html, re.I)
              head_text = page_head.group(1) if page_head else ""
              has_noindex = False
              for meta in re.finditer(r"<meta\b[^>]*>", head_text, re.I):
                  tag = meta.group(0)
                  name = re.search(r"""\bname\s*=\s*(['"])(.*?)\1""", tag, re.I)
                  content = re.search(r"""\bcontent\s*=\s*(['"])(.*?)\1""", tag, re.I)
                  if name and name.group(2).lower() in {"robots", "googlebot", "bingbot"} and content:
                      if re.search(r"(?:^|[,\s])noindex(?:$|[,\s])", content.group(2), re.I):
                          has_noindex = True
              if not has_noindex:
                  active_paths.add(relative)
          missing = sorted(inventory_paths - published_paths)
          unmanifested = sorted(published_paths - inventory_paths)

          assert len(inventory_paths) == 2079, f"Expected 2,079 manifest HTML entries, found {len(inventory_paths)}"
          assert unmanifested == [], f"Published HTML pages missing from manifest: {unmanifested}"
          assert inventory_paths - published_paths == set(missing), "Manifest-only paths are not fully reconciled"
          assert len(inventory_paths) - len(pages) == len(missing), (
              f"Manifest/output reconciliation mismatch: {len(inventory_paths)} manifest paths, "
              f"{len(pages)} published pages, {len(missing)} manifest-only paths"
          )

          taxonomy_names = (
              "professional-audience|job-title|occupation|industry|skill|qualification|"
              "professional-term|job-function|seniority-level|employment-type|career-challenge|"
              "career-search-intent|faq-question|faq-answer|language|country|city|town-locality|institution"
          )
          taxonomy_meta = re.compile(
              rf"""<meta\b(?=[^>]*\bname\s*=\s*(["'])(?:{taxonomy_names})\1)[^>]*>\s*""",
              re.I,
          )
          generated_script = re.compile(
              r"""<script\b(?=[^>]*data-kov\s*=\s*(["'])discovery\1)[^>]*>[\s\S]*?</script\s*>""",
              re.I,
          )
          expected_catalogue_slugs = [
              "audiences", "job-titles", "occupations", "industries", "skills", "qualifications",
              "professional-terms", "job-functions", "seniority-levels", "employment-types",
              "career-challenges", "career-search-intents", "faqs", "languages", "countries",
              "cities", "towns-localities", "institutions",
          ]
          charset_meta = re.compile(r'<meta\b[^>]*\bcharset\s*=[^>]*>', re.I)
          ecosystem_style_re = re.compile(
              r'<link\b(?=[^>]*data-kov-ecosystem-style)[^>]*>',
              re.I,
          )
          head_re = re.compile(r'(<head\b[^>]*>)([\s\S]*?)(</head\s*>)', re.I)
          body_re = re.compile(r'<body\b[^>]*>[\s\S]*?</body\s*>', re.I)
          ecosystem_block_re = re.compile(
              r'(?m)^[ \t]*<section\b(?=[^>]*data-kov-ecosystem\s*=\s*(["\'])v1\1)[^>]*>[\s\S]*?</section\s*>[ \t]*(?:\r?\n|$)',
              re.I,
          )

          def normalize_generated_ecosystem(value):
              return ecosystem_block_re.sub("", value)

          failures = []
          noindex_pages = 0
          catalogue_root_id = "https://www.kovcareeragency.org/data/kov-dataset-catalog.jsonld"
          legacy_catalogue_root = "https://www.kovcareeragency.org/#metadata-catalog"
          def count_catalogue_refs(value):
              if isinstance(value, list):
                  return sum(count_catalogue_refs(item) for item in value)
              if not isinstance(value, dict):
                  return 0
              return (1 if value.get("@id") == catalogue_root_id else 0) + sum(
                  count_catalogue_refs(item)
                  for key, item in value.items()
                  if key != "@id"
              )


          def normalize_expected_cache_versions(value):
              value = re.sub(r"(/assets/kov-site-header\.bundle\.js)\?v=\d+", r"\1?v=8", value)
              value = re.sub(r"(/assets/uniform-footer\.js)\?v=\d+", r"\1?v=15", value)
              value = re.sub(r"(/?css/kov-global-redesign\.css)\?v=\d+", r"\1?v=30", value)
              value = re.sub(r"(/?assets/kov-global-interactions\.js)\?v=\d+", r"\1?v=11", value)
              return value

          for page in pages:
              relative = page.relative_to(output).as_posix()
              source = repo / relative
              before = source.read_text(encoding="utf-8")
              after = page.read_text(encoding="utf-8")
              before_head = head_re.search(before)
              after_head = head_re.search(after)
              if not before_head or not after_head:
                  failures.append(f"{relative}: missing HEAD")
                  continue

              before_body = body_re.search(before)
              after_body = body_re.search(after)
              before_body_text = before_body.group(0) if before_body else ""
              after_body_text = after_body.group(0) if after_body else ""
              if normalize_expected_cache_versions(before_body_text) != normalize_expected_cache_versions(
                  normalize_generated_ecosystem(after_body_text)
              ):
                  failures.append(f"{relative}: BODY changed beyond the approved global asset cache-version refresh and marked ecosystem module")

              def protected_head(value):
                  match = head_re.search(value)
                  inner = generated_script.sub("", match.group(2))
                  inner = ecosystem_style_re.sub("", inner)
                  inner = taxonomy_meta.sub("", inner)
                  inner = re.sub(r'<!--\s*KOV (?:global|page-specific) descriptive metadata[^>]*-->', "", inner, flags=re.I)
                  inner = charset_meta.sub("", inner)
                  return match.group(1) + inner.rstrip() + match.group(3)

              if normalize_expected_cache_versions(protected_head(before)) != normalize_expected_cache_versions(protected_head(after)):
                  failures.append(f"{relative}: existing HEAD metadata, canonical, robots, social tags, scripts, stylesheets or other attributes changed beyond the approved asset cache-version refresh")

              def outside_head(value):
                  return head_re.sub("<!-- KOV_HEAD_BLOCK -->", value, count=1)

              if normalize_expected_cache_versions(outside_head(before)) != normalize_expected_cache_versions(
                  normalize_generated_ecosystem(outside_head(after))
              ):
                  failures.append(f"{relative}: content outside HEAD changed beyond the approved global asset cache-version refresh and marked ecosystem module")

              if not re.match(r'\s*<meta\b[^>]*\bcharset\s*=', after_head.group(2), re.I):
                  failures.append(f"{relative}: charset is not first in HEAD")

              scripts = list(generated_script.finditer(after_head.group(2)))
              if len(scripts) != 1:
                  failures.append(f"{relative}: expected exactly one KOV discovery JSON-LD script, found {len(scripts)}")
                  continue
              script = scripts[0].group(0)
              opening = re.match(r'<script\b[^>]*>', script, re.I).group(0)
              closing = re.search(r'</script\s*>$', script, re.I).group(0)
              try:
                  payload = json.loads(script[len(opening):len(script)-len(closing)])
              except Exception as exc:
                  failures.append(f"{relative}: generated JSON-LD is invalid: {exc}")
                  continue
              graph = payload.get("@graph")
              if not isinstance(graph, list):
                  failures.append(f"{relative}: JSON-LD @graph is missing")
              else:
                  ids = [node.get("@id") for node in graph if node.get("@id")]
                  if len(ids) != len(set(ids)):
                      failures.append(f"{relative}: duplicate JSON-LD @id values")

                  if relative in active_paths:
                      if count_catalogue_refs(graph) != 1:
                          failures.append(f"{relative}: expected exactly one @id reference to the central dataset catalogue")
                      page_nodes = [
                          node for node in graph
                          if node.get("@type") == "WebPage"
                          or (isinstance(node.get("@type"), list) and "WebPage" in node.get("@type"))
                      ]
                      canonical_match = re.search(r"""<link\b(?=[^>]*\brel\s*=\s*(["'])canonical\1)[^>]*\bhref\s*=\s*(["'])(.*?)\2""", before_head.group(2), re.I)
                      canonical_url = canonical_match.group(3) if canonical_match else None
                      page_node = next(
                          (node for node in page_nodes if canonical_url and (
                              node.get("url") == canonical_url or node.get("@id") == canonical_url + "#webpage"
                          )),
                          page_nodes[0] if page_nodes else None,
                      )
                      if not page_node:
                          failures.append(f"{relative}: active public page has no WebPage node")
                      else:
                          about = page_node.get("about", [])
                          if isinstance(about, dict):
                              about = [about]
                          if sum(1 for item in about if isinstance(item, dict) and item.get("@id") == catalogue_root_id) != 1:
                              failures.append(f"{relative}: WebPage.about must contain the central catalogue reference exactly once")
                          if canonical_url and page_node.get("url") != canonical_url:
                              failures.append(f"{relative}: WebPage URL does not match its canonical URL")
                      if any(node.get("@type") == "Dataset" for node in graph):
                          failures.append(f"{relative}: dataset records are still duplicated inline instead of using the central catalogue reference")
                      if any(
                          str(node.get("@id", "")).startswith(legacy_catalogue_root)
                          or str(node.get("@id", "")).startswith("urn:kov:career-agency:metadata#")
                          for node in graph
                      ):
                          failures.append(f"{relative}: legacy inline taxonomy catalogue nodes remain")
                      if any(node.get("numberOfItems") is not None or "recordCount" in json.dumps(node) for node in graph):
                          failures.append(f"{relative}: numeric dataset totals remain duplicated in page JSON-LD")
                  elif count_catalogue_refs(graph) != 0:
                          failures.append(f"{relative}: noindex or inactive page unexpectedly references the central catalogue")
    
              if re.search(
                  r"""<meta\b(?=[^>]*\bname\s*=\s*["']robots["'])(?=[^>]*\bcontent\s*=\s*["'][^"']*\bnoindex\b)[^>]*>""",
                  before_head.group(2),
                  re.I,
              ):
                  noindex_pages += 1

          catalogue_dir = output / "data" / "catalogues"
          for slug in expected_catalogue_slugs:
              package = catalogue_dir / f"{slug}.json.gz"
              if not package.is_file():
                  failures.append(f"Missing compressed catalogue package: {package}")
                  continue
              compressed = package.read_bytes()
              if len(compressed) >= 25 * 1024 * 1024:
                  failures.append(f"{slug}: compressed package reaches or exceeds Cloudflare's 25 MiB per-file limit")
                  continue
              try:
                  catalogue = json.loads(gzip.decompress(compressed))
                  records = catalogue.get("records")
                  if catalogue.get("@type") != "Dataset" or not isinstance(records, list):
                      failures.append(f"{slug}: package is not a complete Dataset records array")
                  elif catalogue.get("recordCount") != len(records):
                      failures.append(f"{slug}: recordCount does not match its full records array")
                  elif not records:
                      failures.append(f"{slug}: catalogue package is empty")
              except Exception as exc:
                  failures.append(f"{slug}: compressed package cannot be decompressed/parsed: {exc}")

          worker_path = output / "_worker.js"
          if not worker_path.is_file():
              failures.append("Cloudflare Pages Worker is missing from build output")
          else:
              worker_source = worker_path.read_text(encoding="utf-8")
              for slug in expected_catalogue_slugs:
                  route = f'["/data/catalogues/{slug}.json", "/data/catalogues/{slug}.json.gz"]'
                  if route not in worker_source:
                      failures.append(f"Worker is missing compressed catalogue route for {slug}")
              if 'headers.delete("Content-Encoding")' not in worker_source:
                  failures.append("Worker does not remove backing-asset Content-Encoding before returning decoded JSON")
              if "application/json; charset=utf-8" not in worker_source:
                  failures.append("Worker does not serve catalogue packages with an application/json content type")

          central_catalogue_url = "https://www.kovcareeragency.org/data/kov-dataset-catalog.jsonld"
          central_archive = output / "data" / "kov-dataset-catalog.jsonld.gz"
          if not central_archive.is_file():
              failures.append("Missing central 18-dataset JSON-LD catalogue package")
          else:
              packed = central_archive.read_bytes()
              if len(packed) >= 25 * 1024 * 1024:
                  failures.append("Central catalogue reaches or exceeds Cloudflare's 25 MiB compressed-file limit")
              try:
                  central_document = json.loads(gzip.decompress(packed))
                  central_graph = central_document.get("@graph")
                  if not isinstance(central_graph, list):
                      failures.append("Central catalogue is missing its @graph array")
                  else:
                      central_ids = [node.get("@id") for node in central_graph if node.get("@id")]
                      if len(central_ids) != len(set(central_ids)):
                          failures.append("Central catalogue contains duplicate @id values")
                      root = next(
                          (node for node in central_graph
                           if node.get("@type") == "DataCatalog" and node.get("@id") == central_catalogue_url),
                          None,
                      )
                      groups = [
                          node for node in central_graph
                          if node.get("@type") == "DataCatalog" and node.get("@id") != central_catalogue_url
                      ]
                      datasets = [node for node in central_graph if node.get("@type") == "Dataset"]
                      if not root:
                          failures.append("Central catalogue root DataCatalog node is missing")
                      if len(groups) != 3:
                          failures.append(f"Central catalogue must contain exactly three parent groups, found {len(groups)}")
                      if len(datasets) != 18:
                          failures.append(f"Central catalogue must contain all 18 datasets, found {len(datasets)}")

                      group_membership = {
                          "professional-employment": 12,
                          "career-knowledge-resources": 2,
                          "global-organisational-references": 4,
                      }
                      group_ids = {
                          central_catalogue_url + "#group-" + key: expected
                          for key, expected in group_membership.items()
                      }
                      for group_id, expected_count in group_ids.items():
                          group = next((node for node in groups if node.get("@id") == group_id), None)
                          if not group:
                              failures.append(f"Central catalogue is missing parent group {group_id}")
                              continue
                          if len(group.get("hasPart", [])) != expected_count:
                              failures.append(f"{group_id}: expected {expected_count} dataset members")
                      dataset_map = {node.get("@id"): node for node in datasets}
                      for slug in expected_catalogue_slugs:
                          dataset_id = central_catalogue_url + "#dataset-" + slug
                          dataset = dataset_map.get(dataset_id)
                          if not dataset:
                              failures.append(f"Central catalogue is missing dataset {slug}")
                              continue
                          records = dataset.get("records")
                          if not isinstance(records, list):
                              failures.append(f"{slug}: central record array is missing or invalid")
                              continue
                          if dataset.get("numberOfItems") != len(records):
                              failures.append(f"{slug}: numberOfItems does not match the complete record array")
                          if dataset.get("distribution", {}).get("contentUrl") != central_catalogue_url:
                              failures.append(f"{slug}: dataset distribution does not point to the central file")
                          description = dataset.get("description", "")
                          audit_terms = re.compile(
                              r"\b(?:row-count|record rows|approved target|target gap|target is not met|"
                              r"validation log|validator|audit note|retained local source snapshot|"
                              r"verified record-level sources present)\b",
                              re.I,
                          )
                          if not isinstance(description, str) or not (50 <= len(description) <= 5000) or audit_terms.search(description):
                              failures.append(f"{slug}: public Dataset description is not clean user-facing text")
                      expected_dataset_ids = {
                          central_catalogue_url + "#dataset-" + slug
                          for slug in expected_catalogue_slugs
                      }
                      if set(dataset_map) != expected_dataset_ids:
                          failures.append("Central catalogue dataset IDs do not match the expected 18 catalogue slugs")
              except Exception as exc:
                  failures.append(f"Central catalogue package cannot be decompressed or parsed: {exc}")

          # The older per-dataset JSON endpoints remain available for existing consumers.
          worker_path = output / "_worker.js"
          if not worker_path.is_file():
              failures.append("Cloudflare Pages Worker is missing from build output")
          else:
              worker_source = worker_path.read_text(encoding="utf-8")
              central_route = '["/data/kov-dataset-catalog.jsonld", "/data/kov-dataset-catalog.jsonld.gz"]'
              if central_route not in worker_source:
                  failures.append("Worker is missing the compressed central catalogue route")
              for slug in expected_catalogue_slugs:
                  route = f'["/data/catalogues/{slug}.json", "/data/catalogues/{slug}.json.gz"]'
                  if route not in worker_source:
                      failures.append(f"Worker is missing the compatibility catalogue route for {slug}")
              if 'headers.delete("Content-Encoding")' not in worker_source:
                  failures.append("Worker does not remove backing-asset Content-Encoding before returning decoded JSON")
              if "application/ld+json; charset=utf-8" not in worker_source:
                  failures.append("Worker does not serve the central catalogue with an application/ld+json content type")

          homepage = output / "index.html"
          homepage_text = homepage.read_text(encoding="utf-8")
          homepage_head = head_re.search(homepage_text).group(2)
          homepage_script = generated_script.search(homepage_head)
          if not homepage_script:
              failures.append("Homepage is missing the generated KOV JSON-LD script")
          else:
              homepage_tag = homepage_script.group(0)
              homepage_open = re.match(r'<script\b[^>]*>', homepage_tag, re.I).group(0)
              homepage_close = re.search(r'</script\s*>$', homepage_tag, re.I).group(0)
              homepage_payload = json.loads(homepage_tag[len(homepage_open):len(homepage_tag)-len(homepage_close)])
              homepage_graph = homepage_payload.get("@graph", [])
              if sum(1 for node in homepage_graph for key, value in node.items() if key == "about" and (
                  (isinstance(value, dict) and value.get("@id") == catalogue_root_id)
                  or (isinstance(value, list) and any(isinstance(item, dict) and item.get("@id") == catalogue_root_id for item in value))
              )) != 1:
                  failures.append("Homepage must reference the central dataset catalogue exactly once in WebPage.about")


          if failures:
              raise SystemExit("\n".join(failures[:100]))

          print(f"PASS: {len(pages):,} published HTML pages each contain one valid KOV JSON-LD script.")
          print(f"PASS: all {len(active_paths):,} active public pages contain one central catalogue @id reference and no duplicated dataset records.")
          print("PASS: central JSON-LD catalogue contains three parent groups and all 18 complete record arrays.")
          print("PASS: all 18 legacy individual JSON endpoints remain available for compatibility.")
          print("PASS: page bodies and all content outside HEAD are unchanged.")
          print("PASS: existing canonical URLs, robots directives, social metadata, scripts, stylesheets and unrelated HEAD content are unchanged.")
          print(f"PASS: {noindex_pages} noindex pages retained their robots directives; inactive pages do not reference full catalogue packages.")
          print(f"PAGE RECONCILIATION: manifest={len(inventory_paths)}; manifest paths absent from public output={len(missing)}; published HTML absent from manifest={len(unmanifested)}; public HTML={len(pages)}; net difference={len(inventory_paths)-len(pages)}.")
          print("Manifest paths excluded from public output:")
          for item in missing:
              print(f"  - {item}")
          print("Published pages absent from manifest:")
          for item in unmanifested:
              print(f"  - {item}")
          PY
      - name: Exercise all 18 compressed catalogue URLs through the Cloudflare Pages Worker
        run: |
          # Pages requires wrangler.jsonc at the project root. Isolate the Pages
          # test root so the repository's existing Worker config remains untouched.
          test_root="$(mktemp -d)"
          cp -a dist "$test_root/dist"
          cat > "$test_root/wrangler.jsonc" <<'EOF'
          {
            "name": "kov-catalogue-pages-test",
            "compatibility_date": "2026-11-17",
            "pages_build_output_dir": "./dist"
          }
          EOF
          (
            cd "$test_root"
            npx --yes wrangler@latest pages dev dist --ip 127.0.0.1 --port 8788 > "$RUNNER_TEMP/kov-pages-dev.log" 2>&1 &
            pages_pid=$!
            trap 'kill "$pages_pid" 2>/dev/null || true' EXIT
            ready=0
            for attempt in $(seq 1 45); do
              if curl --fail --silent --max-time 2 http://127.0.0.1:8788/ >/dev/null; then
                ready=1
                break
              fi
              if ! kill -0 "$pages_pid" 2>/dev/null; then
                cat "$RUNNER_TEMP/kov-pages-dev.log"
                exit 1
              fi
              sleep 1
            done
            if [ "$ready" -ne 1 ]; then
              cat "$RUNNER_TEMP/kov-pages-dev.log"
              exit 1
            fi
            python -u - <<'PY'
          import gzip
          import json
          from urllib.request import Request, urlopen

          base = "http://127.0.0.1:8788"
          central_url = f"{base}/data/kov-dataset-catalog.jsonld"
          with urlopen(Request(central_url, headers={"Accept-Encoding": "identity"}), timeout=30) as response:
              assert response.status == 200, f"central catalogue route returned {response.status}"
              assert "application/ld+json" in response.headers.get("Content-Type", ""), "central catalogue has the wrong Content-Type"
              assert not response.headers.get("Content-Encoding"), "identity request returned an encoded central catalogue"
              central_document = json.loads(response.read())
          central_graph = central_document.get("@graph", [])
          assert len([node for node in central_graph if node.get("@type") == "Dataset"]) == 18, "central endpoint does not contain all 18 Dataset nodes"
          assert len([node for node in central_graph if node.get("@type") == "DataCatalog"]) == 4, "central endpoint must contain one root and three parent groups"
          print("PASS central catalogue: HTTP 200; one root, three parent groups and 18 datasets")

          slugs = [
              "audiences", "job-titles", "occupations", "industries", "skills",
              "qualifications", "professional-terms", "job-functions",
              "seniority-levels", "employment-types", "career-challenges",
              "career-search-intents", "faqs", "languages", "countries",
              "cities", "towns-localities", "institutions",
          ]

          for slug in slugs:
              url = f"{base}/data/catalogues/{slug}.json"
              with urlopen(Request(url, headers={"Accept-Encoding": "gzip"}), timeout=10) as response:
                  assert response.status == 200, f"{slug}: gzip route returned {response.status}"
                  assert "application/json" in response.headers.get("Content-Type", ""), f"{slug}: wrong gzip Content-Type"
                  encoding = response.headers.get("Content-Encoding", "").lower()
                  assert encoding in ("", "identity", "gzip"), f"{slug}: unexpected response encoding {encoding}"
                  compressed = response.read()
              decoded = gzip.decompress(compressed) if encoding == "gzip" else compressed
              catalogue = json.loads(decoded)
              assert catalogue.get("@type") == "Dataset", f"{slug}: response is not a Dataset"
              assert catalogue.get("recordCount") == len(catalogue.get("records", [])), f"{slug}: recordCount mismatch"
              assert catalogue.get("identifier") == f"https://www.kovcareeragency.org/data/catalogues/{slug}.json", f"{slug}: identifier mismatch"

              with urlopen(Request(url, headers={"Accept-Encoding": "identity"}), timeout=10) as response:
                  assert response.status == 200, f"{slug}: identity route returned {response.status}"
                  assert "application/json" in response.headers.get("Content-Type", ""), f"{slug}: wrong identity Content-Type"
                  assert not response.headers.get("Content-Encoding"), f"{slug}: identity response was still encoded"
                  identity = response.read()
              assert identity == decoded, f"{slug}: gzip and identity responses do not contain identical source bytes"
              print(f"PASS {slug}: {catalogue['recordCount']:,} records; gzip and identity HTTP responses verified")

          print(f"PASS: all {len(slugs)} catalogue URLs returned complete JSON through the Cloudflare Pages Worker.")
          PY
          )
          rm -rf "$test_root"
