<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101820">
  <title>KOV Career Agency</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: #101820; color: #f4f1e9; text-align: center; }
    main { width: min(100%, 440px); }
    .mark { display: inline-grid; place-items: center; width: 68px; height: 68px; border: 1px solid #b99b64; border-radius: 18px; color: #d2b47b; font-weight: 800; font-size: 23px; letter-spacing: 1px; }
    h1 { margin: 24px 0 10px; font-size: 25px; }
    p { margin: 0 auto 24px; color: #bdc4ca; line-height: 1.6; }
    button { border: 0; border-radius: 999px; padding: 13px 24px; background: #c5a36c; color: #101820; font: inherit; font-weight: 700; }
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">KOV</div>
    <h1>Connection unavailable</h1>
    <p>KOV Career Agency needs an internet connection to show the latest website content. Check your connection and try again.</p>
    <button type="button" onclick="window.location.href='https://www.kovcareeragency.org/'">Try again</button>
  </main>
</body>
</html>
