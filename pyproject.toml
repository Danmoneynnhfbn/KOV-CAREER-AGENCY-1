[project]
name = "kov-career-agency"
version = "1.0.0"
description = "KOV Career Agency FastAPI application running on Cloudflare Python Workers"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115.0",
    "httpx>=0.27.0",
    "supabase>=2.4.0",
    "stripe>=11.0.0",
    "resend>=2.0.0",
    "openpyxl>=3.1.5,<4.0",
]

[dependency-groups]
dev = [
    "workers-py",
    "workers-runtime-sdk",
]

[tool.uv]
package = false
